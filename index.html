<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thư gửi Thương</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Dancing+Script:wght@500;700&family=Be+Vietnam+Pro:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e8d9b5; --paper2:#d9c698; --ink:#3a2a1c; --brown:#7a4e2d; --seal:#8c2f2a; --bg:#2f2419; --bg2:#4a3826; --glow:#f3e4bd;
  --sky:#c9b88e;
}
@media (prefers-color-scheme: dark){:root{--bg:#231a12;--bg2:#3a2b1c}}
:root[data-theme="light"]{--bg:#2f2419;--bg2:#4a3826}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:hidden;color:var(--ink);
  font-family:'Be Vietnam Pro',Georgia,serif;
  background:
    radial-gradient(ellipse at 50% 40%,var(--bg2) 0%,var(--bg) 75%),
    var(--bg);
  display:flex;align-items:center;justify-content:center;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");}
.stage{position:relative;width:min(92vw,460px);height:min(86vh,640px);display:flex;flex-direction:column;align-items:center;justify-content:center}

/* pigeon */
.pigeon{position:absolute;top:2%;left:-30%;width:120px;opacity:0;animation:fly 9s ease-in-out 0.5s 1 forwards}
.pigeon svg{width:100%;height:auto;overflow:visible}
.wing{transform-origin:62px 42px;animation:flap .5s ease-in-out infinite alternate}
@keyframes flap{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
@keyframes fly{
  0%{left:-30%;top:8%;opacity:0}
  8%{opacity:1}
  50%{left:48%;top:0%;opacity:1;transform:translateX(-50%) scale(1)}
  100%{left:48%;top:0%;opacity:1;transform:translateX(-50%) scale(1)}
}
.pigeon.perched .wing{animation:none}
.pigeon.perched{animation:none;left:50%;top:0;transform:translateX(-50%);opacity:1}

.hint{font-family:'Dancing Script',cursive;font-size:1.5rem;color:var(--glow);margin:0 0 18px;text-align:center;transition:opacity .5s;text-shadow:0 2px 6px #0008}
.hint small{display:block;font-family:'IM Fell English',serif;font-style:italic;font-size:.85rem;opacity:.7;margin-top:2px}

/* envelope */
.env{position:relative;width:min(84vw,360px);aspect-ratio:3/2;cursor:pointer;border:0;background:none;padding:0;
  filter:drop-shadow(0 18px 22px #0009);transition:transform .6s cubic-bezier(.3,.7,.3,1);animation:bob 4s ease-in-out infinite;margin-top:80px}
@keyframes bob{50%{transform:translateY(-6px) rotate(-.6deg)}}
.env:focus-visible{outline:3px dashed var(--glow);outline-offset:8px}
.env .back{position:absolute;inset:0;background:linear-gradient(160deg,#cdb487,#b99c68);border-radius:3px}
.env .stamp{position:absolute;top:10px;right:12px;width:44px;height:54px;background:var(--paper);border:2px dashed var(--brown);padding:3px;z-index:6;display:flex;align-items:center;justify-content:center;transform:rotate(3deg)}
.env .stamp svg{width:100%;height:100%}
.env .addr{position:absolute;left:12%;bottom:22%;z-index:5;font-family:'Dancing Script',cursive;font-size:1.7rem;color:var(--ink);line-height:1.1}
.env .addr span{display:block;font-family:'IM Fell English',serif;font-style:italic;font-size:.8rem;opacity:.6}
.env .front{position:absolute;inset:0;z-index:4;
  background:
    linear-gradient(to top right,transparent 49.6%,#0003 50%,#c4a975 50.4%) left/50% 100% no-repeat,
    linear-gradient(to top left,transparent 49.6%,#0003 50%,#c4a975 50.4%) right/50% 100% no-repeat;
  clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);
  background-color:#d2b883;border-radius:3px}
.env .front::before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);background:linear-gradient(180deg,#e0c995,#cdb07a)}
.env .flap{position:absolute;left:0;top:0;width:100%;height:58%;z-index:7;transform-origin:top;transition:transform .7s ease .1s,z-index 0s .35s;
  background:linear-gradient(180deg,#d9be8a,#c4a46c);clip-path:polygon(0 0,100% 0,50% 100%);}
.env .seal{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-8px 0 0 -23px;border-radius:50%;z-index:9;
  background:radial-gradient(circle at 35% 30%,#b3453d,var(--seal) 60%,#5d1c18);box-shadow:0 3px 6px #0008, inset 0 0 0 3px #0003;
  display:flex;align-items:center;justify-content:center;color:#f0c9a8;font-family:'Dancing Script',cursive;font-size:1.5rem;transition:opacity .3s}
.letter{position:absolute;left:6%;right:6%;top:6%;height:88%;z-index:2;background:var(--paper);border-radius:2px;transition:transform .8s ease .45s}

.env.open{animation:none;cursor:default}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .seal{opacity:0;pointer-events:none}
.env.open .letter{transform:translateY(-46%)}

.bouquet{position:absolute;right:-9%;bottom:-20%;width:36%;z-index:8;transform:rotate(9deg);transform-origin:50% 100%;filter:drop-shadow(0 6px 8px #0007);pointer-events:none;transition:transform .8s ease}
.bouquet svg{display:block;width:100%;height:auto;overflow:visible}
.env:hover .bouquet{transform:rotate(12deg) translateY(-3px)}
.env.open .bouquet{transform:rotate(14deg) translate(10%,6%)}

/* poem overlay */
.poem-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;
  background:#1a110a00;pointer-events:none;transition:background .8s}
.poem-wrap.show{background:#1a110acc;pointer-events:auto}
.paper{position:relative;width:min(92vw,440px);max-height:88vh;overflow:auto;padding:44px 32px 36px;
  background:
    radial-gradient(ellipse at 15% 10%,#f4e8c9 0%,transparent 55%),
    radial-gradient(ellipse at 90% 95%,#c9b27a 0%,transparent 50%),
    var(--paper);
  box-shadow:0 30px 60px #000a, inset 0 0 60px #8a6a3566;
  border-radius:3px;transform:translateY(80px) rotate(-2deg) scale(.85);opacity:0;transition:all .9s cubic-bezier(.2,.8,.2,1) .15s;color:var(--ink)}
.poem-wrap.show .paper{transform:none;opacity:1}
.paper::before{content:"";position:absolute;inset:10px;border:1px solid #7a4e2d55;pointer-events:none}
.to{font-family:'Dancing Script',cursive;font-size:2.1rem;color:var(--brown);margin:0 0 18px}
.line{font-family:'IM Fell English','Be Vietnam Pro',Georgia,serif;font-size:1.22rem;line-height:1.75;margin:0 0 6px;opacity:0;transform:translateY(8px);transition:opacity 1.1s,transform 1.1s}
.line.in{opacity:1;transform:none}
.gap{height:14px}
.sign{margin-top:22px;text-align:right;font-family:'Dancing Script',cursive;font-size:1.5rem;color:var(--brown);opacity:0;transition:opacity 1.5s}
.sign.in{opacity:1}
.close{position:absolute;top:12px;right:16px;background:none;border:0;font-size:1.6rem;color:var(--brown);cursor:pointer;line-height:1;z-index:2}
.close:focus-visible{outline:2px dashed var(--brown)}
.line,.paper{font-synthesis:none}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s!important;transition-duration:.01s!important;transition-delay:0s!important}
}
</style>
</head>
<body>
<main class="stage">
  <div class="pigeon" id="pigeon" aria-hidden="true">
    <svg viewBox="0 0 140 90">
      <g fill="#5b4a3a">
        <path d="M10 55C24 45 44 40 64 40C78 40 88 44 94 48C98 50 102 52 102 54C98 58 90 60 82 62C68 65 44 64 10 55z" fill="#a89a85"/>
        <circle cx="99" cy="45" r="6.5" fill="#8f8270"/>
        <path d="M104 43l11 2.5-11 3z" fill="#c98a3d"/>
        <circle cx="101" cy="43.5" r="1.3" fill="#2a1d12"/>
        <path d="M0 51l26 4-2 6z" fill="#7d705f"/>
        <g class="wing"><path d="M42 44C50 26 76 16 98 18 90 32 76 46 58 49z" fill="#6e6252"/><path d="M52 40C62 28 78 22 94 21" stroke="#cdbfa6" stroke-width="1.3" fill="none"/></g>
      </g>
      <rect x="60" y="63" width="20" height="13" fill="#e8d9b5" stroke="#7a4e2d" stroke-width="1.2" transform="rotate(8 70 70)"/>
      <path d="M60 63l10 7 10-7" stroke="#7a4e2d" stroke-width="1" fill="none" transform="rotate(8 70 70)"/>
    </svg>
  </div>

  <p class="hint" id="hint">Có một lá thư vừa bay đến<small>chạm vào phong thư để mở</small></p>

  <button class="env" id="env" aria-label="Mở phong thư gửi Thương">
    <div class="back"></div>
    <div class="letter"></div>
    <div class="front"></div>
    <div class="flap"></div>
    <div class="seal">♡</div>
    <div class="stamp">
      <svg viewBox="0 0 40 50"><rect x="2" y="2" width="36" height="46" fill="none" stroke="#7a4e2d" stroke-width="1.5"/><path d="M8 34c6-10 16-12 24-6-4 8-14 12-24 6z" fill="#7a4e2d" opacity=".75"/><circle cx="29" cy="24" r="3" fill="#7a4e2d" opacity=".75"/><text x="20" y="45" font-size="6" text-anchor="middle" fill="#7a4e2d" font-family="serif">THƯ</text></svg>
    </div>
    <div class="addr">Gửi Thương<span>— từ một người xa lạ</span></div>
    <div class="bouquet" aria-hidden="true">
      <svg viewBox="0 0 100 135">
        <g fill="#6b7a45">
          <ellipse cx="20" cy="52" rx="6" ry="16" transform="rotate(-50 20 52)"/>
          <ellipse cx="82" cy="54" rx="6" ry="16" transform="rotate(50 82 54)"/>
          <ellipse cx="50" cy="14" rx="5" ry="13" fill="#59693a"/>
          <ellipse cx="30" cy="26" rx="4.5" ry="12" transform="rotate(-28 30 26)" fill="#59693a"/>
          <ellipse cx="71" cy="26" rx="4.5" ry="12" transform="rotate(28 71 26)" fill="#59693a"/>
        </g>
        <g fill="#f4ead2">
          <circle cx="14" cy="34" r="2.2"/><circle cx="20" cy="28" r="1.8"/><circle cx="86" cy="34" r="2.2"/><circle cx="80" cy="27" r="1.8"/><circle cx="38" cy="10" r="1.8"/><circle cx="63" cy="9" r="2"/><circle cx="10" cy="48" r="1.6"/><circle cx="91" cy="49" r="1.6"/>
        </g>
        <polygon points="20,62 80,62 50,132" fill="#b88f5a"/>
        <polygon points="20,62 50,70 50,132" fill="#a77e49"/>
        <path d="M20 62q30 12 60 0" fill="none" stroke="#8c2f2a" stroke-width="4" stroke-linecap="round"/>
        <g>
          <circle cx="50" cy="34" r="14" fill="#c9626b"/><circle cx="50" cy="34" r="9" fill="#b24a55"/><path d="M50 34m-4 0a4 4 0 1 1 4 4" fill="none" stroke="#8c2f3a" stroke-width="1.6"/>
          <circle cx="28" cy="46" r="11" fill="#ebbdb0"/><circle cx="28" cy="46" r="7" fill="#dfa293"/><path d="M28 46m-3 0a3 3 0 1 1 3 3" fill="none" stroke="#b87a6c" stroke-width="1.4"/>
          <circle cx="72" cy="46" r="11" fill="#d98a86"/><circle cx="72" cy="46" r="7" fill="#c4706f"/><path d="M72 46m-3 0a3 3 0 1 1 3 3" fill="none" stroke="#9c4f52" stroke-width="1.4"/>
          <circle cx="39" cy="58" r="9" fill="#f4e3c8"/><circle cx="39" cy="58" r="5.5" fill="#e6cfa8"/><path d="M39 58m-2.5 0a2.5 2.5 0 1 1 2.5 2.5" fill="none" stroke="#b89c70" stroke-width="1.2"/>
          <circle cx="62" cy="58" r="9.5" fill="#b5484f"/><circle cx="62" cy="58" r="6" fill="#9a363f"/><path d="M62 58m-2.5 0a2.5 2.5 0 1 1 2.5 2.5" fill="none" stroke="#6e2229" stroke-width="1.2"/>
        </g>
      </svg>
    </div>
  </button>
</main>

<div class="poem-wrap" id="wrap" aria-hidden="true">
  <article class="paper" role="dialog" aria-label="Bài thơ gửi Thương">
    <button class="close" id="close" aria-label="Đóng thư">×</button>
    <h1 class="to">Gửi Thương,</h1>
    <p class="line">Em chưa thấy anh, anh chưa thấy em,</p>
    <p class="line">Mà anh đã bỏ em giữa lúc chênh vênh.</p>
    <div class="gap"></div>
    <p class="line">Xin lỗi em, người xa lạ dịu dàng,</p>
    <p class="line">Xin cảm ơn sự dịu dàng của em.</p>
    <div class="sign">— một cánh bồ câu mang thư đến</div>
  </article>
</div>

<script>
(function(){
  var env=document.getElementById('env'),wrap=document.getElementById('wrap'),
      hint=document.getElementById('hint'),pigeon=document.getElementById('pigeon'),
      closeBtn=document.getElementById('close'),opened=false,timers=[];
  pigeon.addEventListener('animationend',function(e){if(e.animationName==='fly')pigeon.classList.add('perched')});

  function later(fn,ms){timers.push(setTimeout(fn,ms))}
  function openLetter(){
    if(opened)return;opened=true;
    env.classList.add('open');hint.style.opacity=0;
    later(function(){
      wrap.classList.add('show');wrap.setAttribute('aria-hidden','false');
      var items=wrap.querySelectorAll('.line,.sign');
      items.forEach(function(el,i){later(function(){el.classList.add('in')},900+i*1100)});
      closeBtn.focus();
    },1100);
  }
  function closeLetter(){
    timers.forEach(clearTimeout);timers=[];
    wrap.classList.remove('show');wrap.setAttribute('aria-hidden','true');
    wrap.querySelectorAll('.in').forEach(function(el){el.classList.remove('in')});
    later(function(){
      env.classList.remove('open');opened=false;
      hint.style.opacity=1;hint.firstChild.nodeValue='Thư vẫn ở đây';
      env.focus();
    },500);
  }
  env.addEventListener('click',openLetter);
  closeBtn.addEventListener('click',closeLetter);
  wrap.addEventListener('click',function(e){if(e.target===wrap)closeLetter()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&opened)closeLetter()});
})();
</script>
</body>
</html>
